<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SocialMini</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Main App Layout -->
  <div class="main-layout" id="main-app" style="display: none;">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">SocialMini</div>
      <a href="/" class="nav-item"><span class="icon-home"></span> <span>Home</span></a>
      <a href="/explore.html" class="nav-item"><span class="icon-search"></span> <span>Search</span></a>
      <a href="/explore.html" class="nav-item"><span class="icon-explore"></span> <span>Explore</span></a>
      <a href="#" class="nav-item nav-heart-btn" id="nav-heart-icon" style="position: relative;"><span class="icon-heart"></span> <span>Notifications</span><div id="notif-badge" class="notif-badge" style="display: none;"></div></a>
      <a href="#" class="nav-item" id="create-post-btn"><span class="icon-plus"></span> <span>Create</span></a>
      <a href="#" class="nav-item profile-link">
        <div class="story-avatar-container no-ring current-user-avatar" style="width:24px;height:24px;border:none;"></div>
        <span>Profile</span>
      </a>
      <div style="flex-grow:1;"></div>
      <a href="#" class="nav-item logout-btn"><span class="icon-more"></span> <span>Logout</span></a>
    </aside>

    <!-- Bottom Nav (Mobile) -->
    <div class="bottom-nav">
      <a href="/" class="nav-item"><span class="icon-home"></span></a>
      <a href="/explore.html" class="nav-item"><span class="icon-search"></span></a>
      <a href="#" class="nav-item" id="mobile-create-post-btn"><span class="icon-plus"></span></a>
      <a href="#" class="nav-item nav-heart-btn" style="position: relative;"><span class="icon-heart"></span></a>
      <a href="#" class="nav-item profile-link">
        <div class="story-avatar-container no-ring current-user-avatar" style="width:24px;height:24px;border:none;"></div>
      </a>
    </div>

    <!-- Feed Content -->
    <div class="content-wrapper">
      <main class="feed-container">
        <!-- Stories Row -->
        <div class="stories-row" id="stories-row"></div>
        
        <!-- Posts -->
        <div id="posts-container">
          <!-- Skeletons -->
          <div class="post">
            <div class="post-header"><div class="skeleton" style="width:32px;height:32px;border-radius:50%;margin-right:10px;"></div><div class="skeleton" style="width:100px;height:14px;"></div></div>
            <div class="skeleton" style="width:100%;aspect-ratio:1/1;"></div>
            <div class="post-actions"><div class="skeleton" style="width:24px;height:24px;"></div></div>
          </div>
          <div class="post">
            <div class="post-header"><div class="skeleton" style="width:32px;height:32px;border-radius:50%;margin-right:10px;"></div><div class="skeleton" style="width:100px;height:14px;"></div></div>
            <div class="skeleton" style="width:100%;aspect-ratio:1/1;"></div>
          </div>
          <div class="post">
            <div class="post-header"><div class="skeleton" style="width:32px;height:32px;border-radius:50%;margin-right:10px;"></div><div class="skeleton" style="width:100px;height:14px;"></div></div>
            <div class="skeleton" style="width:100%;aspect-ratio:1/1;"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Auth Modal for index.html -->
  <div class="auth-container" id="auth-modal">
    <div class="auth-box">
      <div class="auth-logo">SocialMini</div>
      <div class="tabs" style="display:flex;gap:20px;justify-content:center;margin-bottom:20px;border-bottom:1px solid #262626;padding-bottom:10px;">
        <div class="tab active" data-tab="login" style="cursor:pointer;color:white;font-weight:600;">Login</div>
        <div class="tab" data-tab="register" style="cursor:pointer;color:#a8a8a8;">Register</div>
      </div>
      <form id="login-form">
        <input type="email" class="input-field" id="login-email" placeholder="Email" required>
        <input type="password" class="input-field" id="login-password" placeholder="Password" required>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding:10px;">Log In</button>
      </form>
      <form id="register-form" style="display: none;">
        <input type="text" class="input-field" id="register-username" placeholder="Username" required>
        <input type="email" class="input-field" id="register-email" placeholder="Email" required>
        <input type="password" class="input-field" id="register-password" placeholder="Password" required>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding:10px;">Sign Up</button>
      </form>
    </div>
  </div>

  <!-- Create Post Modal -->
  <div class="modal-overlay" id="create-modal">
    <div class="modal-content" style="max-width:500px; height:auto;">
      <div class="modal-header">Create new post<button class="modal-close" id="close-create-modal"><span class="icon-close"></span></button></div>
      <div class="modal-body" style="padding:20px; text-align:center;">
        <form id="create-post-form">
          <textarea id="post-content" class="input-field" placeholder="Write a caption..." rows="3" required></textarea>
          <div style="border:2px dashed var(--border); padding:40px; margin-bottom:15px; border-radius:8px; cursor:pointer;" id="drop-zone">
            <span class="icon-explore"></span>
            <p>Drag photos here or click to select</p>
            <input type="file" id="post-image" accept="image/*" style="display:none;">
          </div>
          <img id="image-preview" style="max-width:100%; display:none; margin-bottom:15px; border-radius:8px;" />
          <button type="submit" class="btn btn-primary" style="width:100%;">Share</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Create Story Modal -->
  <div class="modal-overlay" id="story-creator-modal">
    <div class="modal-content" style="max-width:500px; height:auto;">
      <div class="modal-header">Create new story<button class="modal-close" id="close-story-creator">&times;</button></div>
      <div class="modal-body" style="padding:20px; text-align:center;">
        <div style="border:2px dashed var(--border); padding:40px; margin-bottom:15px; border-radius:8px; cursor:pointer;" id="story-drop-zone">
          <p>Drag story photo here or click to select</p>
          <input type="file" id="story-image-input" accept="image/*" style="display:none;">
        </div>
        <div id="story-preview-container" style="display:none; margin-bottom:15px; position:relative;">
          <img id="story-image-preview" style="max-width:100%; border-radius:8px; display:block;" />
          <textarea id="story-caption" class="input-field" placeholder="Add text to story..." rows="2" style="position:absolute; bottom:10px; left:10px; right:10px; width:calc(100% - 20px); background:rgba(0,0,0,0.75); border:1px solid #444;" maxlength="200"></textarea>
          <div id="story-char-counter" style="position:absolute; bottom:-25px; right:10px; font-size:12px; color:var(--text-muted);">0/200</div>
        </div>
        <div style="display:flex; gap:10px; margin-top:30px;">
          <button class="btn btn-secondary" id="story-discard-btn" style="flex:1; cursor:pointer;">Discard</button>
          <button class="btn btn-primary" id="story-share-btn" style="flex:1; cursor:pointer;" disabled>Share to story</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script type="module">
    import { setupAuth } from '/js/auth.js';
    import { initFeed } from '/js/feed.js';
    import { initStories } from '/js/stories.js';
    import { initNotifications } from '/js/notifications.js';
    import { ICONS } from '/js/icons.js';
    
    // Inject icons
    document.querySelectorAll('.icon-home').forEach(el => el.innerHTML = ICONS.home);
    document.querySelectorAll('.icon-search').forEach(el => el.innerHTML = ICONS.search);
    document.querySelectorAll('.icon-explore').forEach(el => el.innerHTML = ICONS.explore);
    document.querySelectorAll('.icon-heart').forEach(el => el.innerHTML = ICONS.heart);
    document.querySelectorAll('.icon-plus').forEach(el => el.innerHTML = ICONS.plusSquare);
    document.querySelectorAll('.icon-more').forEach(el => el.innerHTML = ICONS.more);
    document.querySelectorAll('.icon-close').forEach(el => el.innerHTML = ICONS.close);
    
    document.addEventListener('DOMContentLoaded', () => {
      setupAuth(() => {
        initFeed();
        initStories();
        initNotifications();
      });
    });
  </script>
</body>
</html>
